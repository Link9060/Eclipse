name: Deploy Eclipse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: eclipse-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate missing traveler assets
        run: node scripts/build-traveler.mjs
      - name: Verify character asset coverage
        run: node scripts/verify-traveler.mjs
      - name: Prepare website
        run: |
          test -s index.html
          mkdir -p _site
          cp index.html _site/
          for dir in assets src public; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || true)
            if [[ "$count" == "1" ]]; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Waiting for artifact metadata ($attempt/20)"
            sleep 6
          done
          echo "::error::Pages artifact was not visible after upload. Retry this workflow."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
